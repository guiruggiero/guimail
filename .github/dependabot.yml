version: 2

updates:
  - package-ecosystem: npm
    directories:
      - /email-worker
      - /agent
    schedule:
      interval: monthly
      time: "00:00"
      timezone: America/Los_Angeles
    groups:
      version:
        update-types:
          - patch
          - minor
          - major
      security:
        applies-to: security-updates
        update-types:
          - patch
          - minor
          - major